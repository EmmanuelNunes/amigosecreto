<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520">
  <defs>
    <linearGradient id="bgArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <pattern id="archGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#202c3c" opacity="0.4"/>
    </pattern>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
      
    </style>
  </defs>

  <rect width="1600" height="520" fill="url(#bgArch)"/>
  <rect width="1600" height="520" fill="url(#archGrid)"/>

  <g transform="translate(100, 60)">
    <text x="0" y="0" class="font-mono" font-size="13" font-weight="700" fill="#f43f5e" letter-spacing="2">02 / ARCHITECTURE &amp; PIPELINE</text>
    <text x="0" y="32" class="font-sans" font-size="26" font-weight="800" fill="#ffffff">Fluxo de Validação e Sorteio Aleatório</text>
    <text x="0" y="58" class="font-sans" font-size="15" fill="#8196ae">Da entrada de participantes à celebração visual com física de partículas.</text>
  </g>

  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="280" height="200" rx="10" fill="#0d141e" stroke="#2d4263" stroke-width="1.5"/>
    <text x="24" y="38" class="font-mono" font-size="11" font-weight="700" fill="#f43f5e">ETAPA 01</text>
    <text x="24" y="68" class="font-sans" font-size="18" font-weight="800" fill="#ffffff">Entrada Flexível</text>
    <text x="24" y="96" class="font-sans" font-size="13" fill="#8fa5be">Digitação individual ou lista colada separada por vírgulas.</text>
    <text x="24" y="165" class="font-mono" font-size="11" fill="#71869f">Batch Parsing</text>
  </g>

  <line x1="380" y1="280" x2="480" y2="280" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 4" class="flow-dash"/>

  <g transform="translate(480, 180)">
    <rect x="0" y="0" width="280" height="200" rx="10" fill="#0d141e" stroke="#2d4263" stroke-width="1.5"/>
    <text x="24" y="38" class="font-mono" font-size="11" font-weight="700" fill="#f43f5e">ETAPA 02</text>
    <text x="24" y="68" class="font-sans" font-size="18" font-weight="800" fill="#ffffff">Validação Estrita</text>
    <text x="24" y="96" class="font-sans" font-size="13" fill="#8fa5be">Sanitização de strings, eliminação de espaços e duplicatas.</text>
    <text x="24" y="165" class="font-mono" font-size="11" fill="#71869f">Validation Rules</text>
  </g>

  <line x1="760" y1="280" x2="860" y2="280" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 4" class="flow-dash"/>

  <g transform="translate(860, 180)">
    <rect x="0" y="0" width="280" height="200" rx="10" fill="#0d141e" stroke="#2d4263" stroke-width="1.5"/>
    <text x="24" y="38" class="font-mono" font-size="11" font-weight="700" fill="#f43f5e">ETAPA 03</text>
    <text x="24" y="68" class="font-sans" font-size="18" font-weight="800" fill="#ffffff">Algoritmo de Sorteio</text>
    <text x="24" y="96" class="font-sans" font-size="13" fill="#8fa5be">Seleção aleatória sem viés entre os participantes cadastrados.</text>
    <text x="24" y="165" class="font-mono" font-size="11" fill="#71869f">Random Selection</text>
  </g>

  <line x1="1140" y1="280" x2="1240" y2="280" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 4" class="flow-dash"/>

  <g transform="translate(1240, 180)">
    <rect x="0" y="0" width="260" height="200" rx="10" fill="#0d141e" stroke="#2d4263" stroke-width="1.5"/>
    <text x="24" y="38" class="font-mono" font-size="11" font-weight="700" fill="#f43f5e">ETAPA 04</text>
    <text x="24" y="68" class="font-sans" font-size="18" font-weight="800" fill="#ffffff">Celebração Canvas</text>
    <text x="24" y="96" class="font-sans" font-size="13" fill="#8fa5be">Disparo de confetes em tela cheia via Canvas Confetti.</text>
    <text x="24" y="165" class="font-mono" font-size="11" fill="#71869f">canvas-confetti</text>
  </g>
</svg>
