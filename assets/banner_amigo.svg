<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <linearGradient id="bgAmigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140612"/>
      <stop offset="50%" stop-color="#1f0a24"/>
      <stop offset="100%" stop-color="#0a030c"/>
    </linearGradient>

    <linearGradient id="amigoTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="35%" stop-color="#fb7185"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <radialGradient id="amigoGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 52px; fill: url(#amigoTitleGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 19px; fill: #94a3b8; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #fecdd3; }
  </style>

  <rect width="1200" height="340" rx="20" fill="url(#bgAmigo)"/>
  <rect width="1200" height="340" rx="20" fill="url(#amigoGlow)"/>
  <rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="#881337" stroke-width="1.8"/>

  <!-- Confetes decorativos sutis -->
  <g opacity="0.4">
    <circle cx="120" cy="80" r="4" fill="#fb7185"/>
    <rect x="220" y="120" width="8" height="8" rx="2" fill="#f59e0b" transform="rotate(25 220 120)"/>
    <circle cx="160" cy="220" r="5" fill="#38bdf8"/>
    <rect x="290" y="190" width="7" height="7" rx="1" fill="#a855f7" transform="rotate(45 290 190)"/>
    <circle cx="1050" cy="90" r="5" fill="#f59e0b"/>
    <rect x="960" y="140" width="8" height="8" rx="2" fill="#fb7185" transform="rotate(30 960 140)"/>
    <circle cx="1020" cy="230" r="4" fill="#34d399"/>
    <rect x="910" y="210" width="7" height="7" rx="1" fill="#38bdf8" transform="rotate(15 910 210)"/>
  </g>

  <g text-anchor="middle">
    <!-- Tag superior -->
    <text x="600" y="80" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#fb7185" letter-spacing="3">
      WEB APP INTERATIVO • SORTEIO FESTIVO
    </text>

    <!-- Título Principal -->
    <text x="600" y="145" class="title" filter="url(#glow)">🎁 Amigo Secreto</text>

    <!-- Subtítulo -->
    <text x="600" y="190" class="subtitle">
      Sorteador Aleatório de Nomes com Inserção em Lote, Chips Dinâmicos e Confetes
    </text>

    <!-- Chips / Badges Visuais -->
    <g transform="translate(230, 235)">
      <rect x="0" y="0" width="160" height="34" rx="17" fill="#2e0817" stroke="#9f1239" stroke-width="1.2"/>
      <text x="80" y="21" class="badge-txt">🎲 Sorteio Aleatório</text>

      <rect x="175" y="0" width="165" height="34" rx="17" fill="#2e0817" stroke="#9f1239" stroke-width="1.2"/>
      <text x="257" y="21" class="badge-txt">📝 Inserção em Lote</text>

      <rect x="355" y="0" width="170" height="34" rx="17" fill="#2e0817" stroke="#9f1239" stroke-width="1.2"/>
      <text x="440" y="21" class="badge-txt">🎉 Canvas Confetti</text>

      <rect x="540" y="0" width="190" height="34" rx="17" fill="#2e0817" stroke="#9f1239" stroke-width="1.2"/>
      <text x="635" y="21" class="badge-txt">⚡ 100% Vanilla JS</text>
    </g>
  </g>
</svg>
